<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>深海 · 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- 左侧：实时预览。用的是**表单里当前的值**，不是已保存的值 ——
           改一个滑块就该立刻看到效果。 -->
      <aside class="preview">
        <canvas id="preview"></canvas>
        <div class="preview__label">
          <span id="preview-surface">新标签页</span>
          <span id="preview-note"></span>
        </div>
      </aside>

      <main class="panel">
        <header class="head">
          <h1>深海</h1>
          <p class="head__sub">
            打开的每个标签页都是水里的一只发光生物。休眠的会暗下去，
            出声的会亮起来，点一下就能切过去。
          </p>
        </header>

        <div class="tabs" role="tablist">
          <button class="tabs__btn is-active" data-surface="newtab" role="tab">新标签页</button>
          <button class="tabs__btn" data-surface="overlay" role="tab">页面覆盖层</button>
        </div>

        <div id="form"></div>

        <footer class="foot">
          <span id="save-state" class="foot__state"></span>
          <button id="reset" class="foot__btn" type="button">恢复默认</button>
        </footer>
      </main>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
