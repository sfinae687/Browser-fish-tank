<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新标签页</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <!-- 深海。生物画在这块画布上，每个生物对应一个打开的标签页。 -->
    <canvas id="tank" aria-label="深海"></canvas>

    <!-- 悬停时跟着指针出现的标签页标题 -->
    <div id="tip" class="tip" hidden></div>

    <!-- 时钟。新标签页该有的东西，做得很轻，不抢画面。 -->
    <div class="clock">
      <div id="time" class="clock__time">--:--</div>
      <div id="date" class="clock__date">—</div>
    </div>

    <!-- 状态。默认极淡，鼠标不动一会儿就完全隐去。 -->
    <div id="hud" class="hud">
      <span id="status">正在下潜…</span>
      <button id="titles" class="hud__link" type="button" hidden>显示标签页标题</button>
    </div>

    <!-- WebGL 起不来时的兜底 -->
    <div id="fallback" class="fallback" hidden>
      <p id="fallback-msg">这片海没能加载出来。</p>
      <button id="fallback-options" class="fallback__btn" type="button">打开设置</button>
    </div>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
